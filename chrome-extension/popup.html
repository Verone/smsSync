<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Sync</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 SMS Sync</h1>
            <div class="status" id="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="config-section">
            <label for="backendUrl">Backend Server URL:</label>
            <input type="text" id="backendUrl" placeholder="ws://your-backend-url.com" />
            <label for="apiSecret" style="margin-top: 8px; display: block;">API Secret:</label>
            <input type="password" id="apiSecret" placeholder="Your API Secret" />
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button id="saveBtn" style="flex: 1;">Save & Connect</button>
                <button id="disconnectBtn" style="flex: 1; display: none; background-color: #dc3545; color: white;">Disconnect</button>
            </div>
        </div>

        <div class="messages-section">
            <h2>Messages</h2>
            <div id="messagesList" class="messages-list">
                <p class="empty-message">No messages yet. Connect to start receiving SMS.</p>
            </div>
        </div>

        <button id="clearBtn" class="clear-btn">Clear Messages</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
